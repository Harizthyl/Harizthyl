<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Briar Rovic Z. Elemino, diving into code" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8fd6"/><stop offset="0.5" stop-color="#14589a"/><stop offset="1" stop-color="#08224a"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#4f9bd8"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="240" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="240" fill="url(#sea)"/>

    <!-- light rays -->
    <g fill="#bfeaff" opacity="0.10">
      <polygon points="120,0 190,0 120,240 40,240"/>
      <polygon points="380,0 450,0 400,240 320,240"/>
      <polygon points="640,0 700,0 660,240 580,240"/>
      <animate attributeName="opacity" values="0.06;0.14;0.06" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- bubbles -->
    <g fill="none" stroke="#d8f4ff" stroke-width="1.5" opacity="0.8">
      <circle cx="90" cy="230" r="5"><animate attributeName="cy" values="240;-10" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="230" r="8"><animate attributeName="cy" values="240;-10" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="230" r="4"><animate attributeName="cy" values="240;-10" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="230" r="7"><animate attributeName="cy" values="240;-10" dur="8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="590" cy="230" r="5"><animate attributeName="cy" values="240;-10" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="230" r="9"><animate attributeName="cy" values="240;-10" dur="10s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- swimming shark (original design) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-140,0;940,0" dur="16s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0;0,10;0,0" dur="3.2s" repeatCount="indefinite"/>
        <g transform="translate(0,175)">
          <!-- tail -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-10 -44 0;12 -44 0;-10 -44 0" dur="0.8s" repeatCount="indefinite"/>
            <path d="M-44,0 L-82,-26 Q-70,0 -82,26 Z" fill="#4f9bd8"/>
          </g>
          <!-- dorsal fin -->
          <path d="M-8,-28 L10,-58 L22,-26 Z" fill="#4f9bd8"/>
          <!-- body -->
          <ellipse cx="0" cy="0" rx="52" ry="31" fill="#5aa7e0"/>
          <path d="M-50,8 Q0,40 50,8 Q40,31 0,31 Q-40,31 -50,8 Z" fill="#eaf8ff"/>
          <!-- side fin -->
          <path d="M-6,14 L-24,34 L8,24 Z" fill="#4f9bd8"/>
          <!-- eye -->
          <circle cx="26" cy="-6" r="9" fill="#fff"/>
          <circle cx="28" cy="-5" r="5" fill="#16213d"/>
          <circle cx="30" cy="-7" r="1.8" fill="#fff"/>
          <!-- cheek -->
          <circle cx="14" cy="8" r="5" fill="#ff9fbd" opacity="0.8"/>
          <!-- smile with teeth -->
          <path d="M30,10 Q40,18 49,8" fill="none" stroke="#16213d" stroke-width="2" stroke-linecap="round"/>
          <path d="M36,13 l2,4 l2,-3 M41,14 l2,3 l2,-4" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- seaweed -->
    <g fill="none" stroke="#2fbf8f" stroke-width="7" stroke-linecap="round">
      <path d="M40,240 Q30,215 42,195 Q52,175 40,155"><animateTransform attributeName="transform" type="rotate" values="-4 40 240;5 40 240;-4 40 240" dur="4s" repeatCount="indefinite"/></path>
      <path d="M62,240 Q72,220 60,205 Q50,190 62,175"><animateTransform attributeName="transform" type="rotate" values="5 62 240;-5 62 240;5 62 240" dur="3.4s" repeatCount="indefinite"/></path>
      <path d="M740,240 Q730,215 742,195 Q752,175 740,155"><animateTransform attributeName="transform" type="rotate" values="4 740 240;-5 740 240;4 740 240" dur="3.8s" repeatCount="indefinite"/></path>
      <path d="M764,240 Q774,222 762,208 Q752,194 764,180"><animateTransform attributeName="transform" type="rotate" values="-5 764 240;5 764 240;-5 764 240" dur="4.4s" repeatCount="indefinite"/></path>
    </g>

    <!-- title -->
    <text x="400" y="92" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#ffffff" stroke="#0a3a6e" stroke-width="1">Briar Rovic Z. Elemino
      <animate attributeName="y" values="92;86;92" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="124" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="18" fill="#d8f4ff">diving into code, one wave at a time</text>

    <!-- waves on top -->
    <g>
      <path d="M0,16 Q50,0 100,16 T200,16 T300,16 T400,16 T500,16 T600,16 T700,16 T800,16 T900,16 T1000,16 V0 H0 Z" fill="#bfeaff" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,0;-200,0" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M0,10 Q50,-4 100,10 T200,10 T300,10 T400,10 T500,10 T600,10 T700,10 T800,10 T900,10 T1000,10 V0 H0 Z" fill="#eaf8ff">
        <animateTransform attributeName="transform" type="translate" values="-200,0;0,0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
